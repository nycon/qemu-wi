worker_processes auto;

events {
    worker_connections 1024;
}

# TCP load balancers (host-agent writes stream_*.conf)
stream {
    include /etc/nginx/lb-configs/stream_*.conf;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10G;

    # Security headers (platform servers may add HSTS when SSL is active)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Reverse proxy rules for VM domains (host-managed)
    include /etc/nginx/proxy-configs/*.conf;

    # HTTP/HTTPS load balancers (host-agent writes http_*.conf)
    include /etc/nginx/lb-configs/http_*.conf;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP/HTTPS server blocks – host-specific (SSL certs), safe for git pull
    include /etc/qemu-interface/nginx-platform.conf;
}
